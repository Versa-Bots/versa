name: Quality Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, typecheck]
        include:
          - check: format
            name: "Format Check"
            command: "uv run ruff format --output-format github --check ."
          - check: lint
            name: "Lint Check"
            command: "uv run ruff check --output-format github ."
          - check: typecheck
            name: "Type Check"
            command: "uv run basedpyright ."
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: "auto"

      - name: Sync dependencies
        run: uv sync

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
